<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strong Password Generator</title>
<style>
  .wct-password{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f3f5f9;color:#1c2333;line-height:1.6;min-height:100vh;padding:28px 16px;box-sizing:border-box}
  .wct-password *{box-sizing:border-box;margin:0;padding:0}
  .wct-password .wrap{max-width:620px;margin:0 auto}
  .wct-password h1{font-size:1.8rem;margin-bottom:6px;border:none}
  .wct-password .sub{color:#5a6478;margin-bottom:22px}
  .wct-password .card{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(16,24,64,.07);padding:22px}
  .wct-password .output{display:flex;gap:10px;align-items:center}
  .wct-password #pass{flex:1;background:#f6f8fd;border:2px solid #dde2ec;border-radius:10px;padding:13px 14px;font-size:1.15rem;font-family:ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
  .wct-password .meter{margin:14px 0 4px;background:#eef1f7;border-radius:99px;height:10px;overflow:hidden}
  .wct-password #fill{height:100%;width:0;border-radius:99px;transition:width .3s,background .3s}
  .wct-password .lbl{display:flex;justify-content:space-between;font-size:.85rem;color:#6b7488;margin-bottom:4px}
  .wct-password .opts{margin:18px 0}
  .wct-password .opt{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eef1f7}
  .wct-password .opt label{font-size:.95rem}
  .wct-password input[type=checkbox]{width:19px;height:19px;accent-color:#4f6ef2}
  .wct-password input[type=range]{width:100%;accent-color:#4f6ef2}
  .wct-password .btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .wct-password button{background:#4f6ef2;color:#fff;border:0;border-radius:8px;padding:11px 20px;font-size:.95rem;font-weight:600;cursor:pointer;transition:transform .1s,opacity .2s}
  .wct-password button:hover{opacity:.9}
  .wct-password button:active{transform:scale(.97)}
  .wct-password button.ghost{background:#e8ecf7;color:#33405c}
  .wct-password .hint{font-size:.8rem;color:#8a93a6;margin-top:14px}
  .wct-password #strength{font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<div class="wct-password">
<div class="wrap">
  <h1>Strong Password Generator</h1>
  <p class="sub">Create secure random passwords instantly. Choose length and character types to match any website's requirements.</p>
  <div class="card">
    <div class="output">
      <div id="pass">P6x#vQ2!rTm9</div>
      <button class="ghost" onclick="copy()">Copy</button>
    </div>
    <div class="meter"><div id="fill"></div></div>
    <div class="lbl"><span>Strength</span><span id="strength">Good</span></div>
    <div class="opts">
      <div class="opt"><label for="len">Length: <b id="lenVal">12</b></label></div>
      <input type="range" id="len" min="6" max="64" value="12" oninput="lenVal.textContent=this.value;gen()">
      <div class="opt"><label for="u">Uppercase (A-Z)</label><input type="checkbox" id="u" checked onchange="gen()"></div>
      <div class="opt"><label for="l">Lowercase (a-z)</label><input type="checkbox" id="l" checked onchange="gen()"></div>
      <div class="opt"><label for="n">Numbers (0-9)</label><input type="checkbox" id="n" checked onchange="gen()"></div>
      <div class="opt"><label for="s">Symbols (!@#$%^&amp;*)</label><input type="checkbox" id="s" checked onchange="gen()"></div>
    </div>
    <div class="btnrow">
      <button onclick="gen()">Generate</button>
      <button class="ghost" onclick="copy()">Copy password</button>
    </div>
    <p class="hint">Passwords are created locally in your browser and never sent to any server. Enable "symbols" for maximum security.</p>
  </div>
</div>
</div>
<script>
  const sets = {
    u: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    l: 'abcdefghijklmnopqrstuvwxyz',
    n: '0123456789',
    s: '!@#$%^&*()_+-=[]{};:,.<>?'
  };
  const cryptoObj = window.crypto;
  function randomInt(max) {
    const buf = new Uint32Array(1);
    cryptoObj.getRandomValues(buf);
    return buf[0] % max;
  }
  function gen() {
    const length = +document.getElementById('len').value;
    const pool = [];
    if (document.getElementById('u').checked) pool.push('u');
    if (document.getElementById('l').checked) pool.push('l');
    if (document.getElementById('n').checked) pool.push('n');
    if (document.getElementById('s').checked) pool.push('s');
    if (!pool.length) { pool.push('l'); document.getElementById('l').checked = true; }
    let chars = '', out = '';
    pool.forEach(p => { chars += sets[p]; out += sets[p][randomInt(sets[p].length)]; });
    for (let i = out.length; i < length; i++) out += chars[randomInt(chars.length)];
    out = out.split('').sort(() => Math.random() - 0.5).join('');
    document.getElementById('pass').textContent = out;
    score(out);
  }
  function score(pw) {
    let s = 0;
    if (pw.length >= 12) s++; if (pw.length >= 20) s++;
    if (/[A-Z]/.test(pw)) s++; if (/[a-z]/.test(pw)) s++;
    if (/[0-9]/.test(pw)) s++; if (/[^A-Za-z0-9]/.test(pw)) s++;
    const labels = ['Very weak','Weak','Fair','Good','Strong','Very strong'];
    const colors = ['#e5484d','#e5484d','#f5a524','#4f6ef2','#30a46c','#30a46c'];
    const i = Math.min(s, 5);
    document.getElementById('strength').textContent = labels[i];
    document.getElementById('fill').style.width = (s / 6 * 100) + '%';
    document.getElementById('fill').style.background = colors[i];
  }
  function copy() {
    navigator.clipboard.writeText(document.getElementById('pass').textContent).then(() => { alert('Password copied!'); });
  }
  gen();
</script>
</body>
</html>
